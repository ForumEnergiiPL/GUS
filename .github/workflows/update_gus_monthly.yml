name: Monthly GUS gas update

on:
  workflow_dispatch:
  schedule:
    # 20. dzień każdego miesiąca, 07:15 UTC
    - cron: '15 7 20 * *'

permissions:
  contents: write

concurrency:
  group: monthly-gus-gas-update
  cancel-in-progress: false

jobs:
  update-gus:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show files before update
        shell: bash
        run: |
          echo '======================================'
          echo 'FILES BEFORE UPDATE'
          echo '======================================'
          for file in \
            gus_gaz_miesieczne_import-towarow-wedlug-kraju-pochodzenia.csv \
            gus_gaz_roczne_import-towarow-wedlug-kraju-pochodzenia.csv \
            gus_gaz_export_miesieczne.csv \
            gus_gaz_export_roczne.csv
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
            echo "$file:"
            wc -l "$file"
          done

      - name: Update GUS gas data
        shell: bash
        run: python update_gus_gaz.py

      - name: Show files after update
        shell: bash
        run: |
          echo '======================================'
          echo 'FILES AFTER UPDATE'
          echo '======================================'
          for file in \
            gus_gaz_miesieczne_import-towarow-wedlug-kraju-pochodzenia.csv \
            gus_gaz_roczne_import-towarow-wedlug-kraju-pochodzenia.csv \
            gus_gaz_export_miesieczne.csv \
            gus_gaz_export_roczne.csv
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing $file"
              exit 1
            fi
            echo "$file:"
            wc -l "$file"
          done

      - name: Configure Git
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          git add -- \
            gus_gaz_miesieczne_import-towarow-wedlug-kraju-pochodzenia.csv \
            gus_gaz_roczne_import-towarow-wedlug-kraju-pochodzenia.csv \
            gus_gaz_export_miesieczne.csv \
            gus_gaz_export_roczne.csv
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Brak nowych lub zmienionych danych GUS.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'Dane GUS zostały zaktualizowane.'
            git diff --cached --stat
          fi

      - name: Commit updated GUS data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: git commit -m 'Update monthly GUS gas data'

      - name: Push updated GUS data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git pull --rebase origin main
          git push origin main
